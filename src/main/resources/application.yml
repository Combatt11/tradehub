spring:
  # Carga opcional del .env local; en produccion se inyectan variables reales.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: nexusmarket

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${DB_USERNAME:nexusmarket}"
    password: "${DB_PASSWORD:nexusmarket}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://nexusmarket:nexusmarket@localhost:27017/nexusmarket?authSource=admin}"
      auto-index-creation: true

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

nexusmarket:
  security:
    jwt:
      secret: "${JWT_SECRET:Zcay4Pbqye9gBsBYw6ksksORVNXUibiIh1A+Nfey3QE=}"
      expiration: ${JWT_EXPIRATION:900000}
